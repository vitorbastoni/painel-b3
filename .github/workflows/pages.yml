name: Publicar no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      # v5 omite arquivos ocultos por padrão; .nojekyll precisa entrar no pacote.
      - name: Enviar site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
          include-hidden-files: true

  # Upload e deploy em jobs separados. No mesmo job, deploy-pages@v4/v5 lista
  # o artefato antes de ele aparecer e falha com
  # "No artifacts named github-pages were found" (actions/deploy-pages#451).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
